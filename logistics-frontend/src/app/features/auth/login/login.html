<div class="container d-flex justify-content-center align-items-center vh-100 bg-light">
  
  <div class="card shadow-lg p-5 rounded-4" style="width: 25rem;">
    
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold">Sinergia Logistics</h2>
      <p class="text-muted">Inicia sesión en tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="errorMessage" class="alert alert-danger py-2 text-center shadow-sm">
        {{ errorMessage }}
      </div>

      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Usuario</label>
        <input type="text" id="username" class="form-control form-control-lg" formControlName="username"
               [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        <div class="invalid-feedback">El usuario es obligatorio.</div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <input type="password" id="password" class="form-control form-control-lg" formControlName="password"
               [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <div class="invalid-feedback">La contraseña es obligatoria.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold" [disabled]="loginForm.invalid">
        Ingresar
      </button>
      
    </form>
  </div>
</div>
